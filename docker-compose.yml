version: '3.8'

services:
  vouchlab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vouchlab_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=vouchlab_production_jwt_secret_key_change_in_prod
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      # Persistent local storage for user uploaded certificates & condition photos
      - vouchlab_uploads:/app/server/uploads
      # Persistent local SQLite DB file
      - vouchlab_data:/app/server/src/db

volumes:
  vouchlab_uploads:
  vouchlab_data:

